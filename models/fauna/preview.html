<!doctype html><html lang="vi"><meta charset="utf-8"><title>Mekong fauna: before / after review</title>
<style>body{margin:0;background:#c8d2cb;font:14px system-ui;color:#193329}#tools{position:absolute;top:12px;left:12px;right:12px;background:#fffffff0;padding:12px;border-radius:8px}select,button{font:inherit;margin:3px}#labels{position:absolute;bottom:20px;left:0;right:0;display:flex;text-align:center;pointer-events:none}#labels span{width:50%;font-size:19px;font-weight:700}small{display:block}canvas{display:block}#error{color:#b00}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<div id="tools"><b>Mekong fauna · Trước / Sau — before / after</b><br><label>Animal <select id="species"></select></label><label>Clip <select id="clip"></select></label><label><input type="checkbox" id="far"> Far LOD</label><button id="side">Side</button><button id="front">Front</button><button id="top">Top</button><button id="orbit">Three-quarter</button><button id="pause">Pause</button><small id="info">Loading…</small><small id="error"></small></div><div id="labels"><span>TRƯỚC · BEFORE</span><span>SAU · AFTER</span></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {FaunaLayer} from '../../src/fauna.js';
const labels={egret:'Cò trắng / Little egret',duck:'Vịt chạy đồng / Field duck',cattle:'Bò Bảy Núi / Local cattle',sparrow:'Chim sẻ / Tree sparrow',myna:'Chim sáo / Common myna',dove:'Chim cu / Spotted dove',swallow:'Chim én / Barn swallow',kingfisher:'Bói cá / Kingfisher',cormorant:'Cồng cọc / Cormorant','grey-heron':'Diệc xám / Grey heron','pond-heron':'Cò bợ / Pond heron','cattle-egret':'Cò ma / Cattle egret',keeper:'Người chăn vịt / Duck keeper',angler:'Người câu cá / Angler',snakehead:'Cá lóc / Snakehead',perch:'Cá rô / Climbing perch',pomacea:'Ốc bươu vàng / Pomacea',pila:'Ốc bươu đồng / Pila sp.','snail-eggs':'Trứng ốc bươu vàng / Pomacea eggs'};
const scene=new THREE.Scene();scene.background=new THREE.Color('#c8d2cb');const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.outputColorSpace=THREE.SRGBColorSpace;document.body.append(r.domElement);r.setScissorTest(true);
const cam=new THREE.PerspectiveCamera(35,innerWidth/2/innerHeight,.001,100);const controls=new OrbitControls(cam,r.domElement);let size=1,centre=.5,angle='side',paused=true,last=performance.now();
scene.add(new THREE.HemisphereLight(0xf5ffff,0x70644e,2));const sun=new THREE.DirectionalLight(0xfff6df,2.5);sun.position.set(3,5,4);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x89917c,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.0005;scene.add(ground);
const terrain={heightAt:()=>0,ex:1};const current=new FaunaLayer(terrain,{preview:true});const previous=new FaunaLayer(terrain,{preview:true,assetBase:new URL('./previous/',location.href).href});
scene.add(previous.group,current.group);const sel=document.querySelector('#species'),clip=document.querySelector('#clip'),far=document.querySelector('#far'),info=document.querySelector('#info');sel.innerHTML=Object.entries(labels).map(([id,label])=>`<option value="${id}">${label}</option>`).join('');
try{await Promise.all([current.load(),previous.load()]);}catch(e){document.querySelector('#error').textContent=e.message;throw e;}
for(const f of [current,previous])for(const o of [f.support,f.posts,f.traps,f.ropes,f.effects.mesh])o.visible=false;
function orient(){controls.target.set(0,centre,0);const d=size*2.5;cam.up.set(0,1,0);cam.position.set(...(angle==='side'?[d,centre+.08*size,0]:angle==='front'?[0,centre+.08*size,d]:angle==='top'?[.00001,centre+d,.00001]:[d*.75,centre+d*.45,d*.75]));controls.update();draw();}
function setup(){const a=current.lookup.get(sel.value+'-0').a;clip.innerHTML=a.clips.map(c=>`<option>${c.name}</option>`).join('');const b=a.reference_bbox_m||[.05,.05,.07];size=Math.max(...b);centre=b[1]*.5;current.clock.value=previous.clock.value=0;orient();}
sel.onchange=setup;setup();document.querySelector('#pause').textContent='Play';document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';};for(const id of ['side','front','top','orbit'])document.getElementById(id).onclick=()=>{angle=id;orient();};
function show(f,on){for(const p of f.pools){p.mesh.visible=on&&p.a.id===sel.value&&p.a.lod===(far.checked?1:0);p.mesh.count=p.mesh.visible?1:0;if(p.mesh.visible){p.mesh.setMatrixAt(0,new THREE.Matrix4());p.mesh.setColorAt(0,new THREE.Color(sel.value==='cattle'?0xb17636:sel.value==='duck'?0xb59869:0xffffff));p.mesh.instanceMatrix.needsUpdate=true;p.mesh.instanceColor.needsUpdate=true;const c=p.a.clips.find(c=>c.name===clip.value)||p.a.clips[0];p.clips.setXYZW(0,c.start,1,c.duration,0);p.clips.needsUpdate=true;}}}
function frame(now){const dt=(now-last)/1000;last=now;if(!paused){current.clock.value+=dt;previous.clock.value+=dt;}controls.update();draw();requestAnimationFrame(frame);}
function draw(){const w=innerWidth/2,h=innerHeight;show(previous,true);show(current,false);r.setViewport(0,0,w,h);r.setScissor(0,0,w,h);r.render(scene,cam);show(previous,false);show(current,true);r.setViewport(w,0,w,h);r.setScissor(w,0,w,h);r.render(scene,cam);const a=current.lookup.get(sel.value+'-'+(far.checked?1:0)).a,old=previous.lookup.get(sel.value+'-'+(far.checked?1:0));info.textContent=`${labels[sel.value]} · old ${old?.a.triangles??'new species'} / new ${a.triangles} triangles · ${clip.value} · real metres · ${angle} view · original painted atlas`;}clip.onchange=draw;far.onchange=draw;controls.addEventListener('change',draw);requestAnimationFrame(frame);
onresize=()=>{cam.aspect=innerWidth/2/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);};
</script></html>
